name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic version tag to publish (for example, v0.2.0)
        required: true
        type: string
      include_windows:
        description: Build signed Windows packages (requires Authenticode secrets)
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_REF: ${{ inputs.tag || github.ref }}
  RELEASE_WINDOWS_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_windows) || (github.event_name == 'push' && vars.RELEASE_WINDOWS_ENABLED == 'true') }}

jobs:
  validate:
    runs-on: ubuntu-22.04
    # Every downstream job checks out this commit SHA instead of the tag, so a
    # tag moved mid-run cannot make two jobs build different commits.
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate tag and package versions
        run: node scripts/release/validate-release-tag.mjs --tag "$RELEASE_TAG"
      # fetch-depth: 0 above is what populates refs/remotes/origin/*; the check
      # is evaluated against main's tip at run time, so a commit that is on main
      # when the release starts can still be rewritten out of main afterwards.
      - name: Require the tagged commit to be on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Pin the release to the resolved commit SHA
        id: resolve
        run: echo "sha=$(git rev-parse HEAD^{commit})" >> "$GITHUB_OUTPUT"

  quality:
    needs: validate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run release:verify:package

  hermetic-e2e:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run build:bundle
      - run: npm run test:e2e:hermetic

  package:
    needs: [validate, quality, hermetic-e2e]
    strategy:
      # Ship both mac architectures as separate DMG/ZIP builds. Each leg runs
      # on a runner whose native architecture matches the target so
      # install-app-deps never cross-compiles node-pty or zeromq, and one
      # leg's failure never cancels the other's signed build.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Fail closed unless every release credential is configured
        run: npm run release:preflight
        env:
          RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # CI runs the full typecheck/lint/test suite for this commit; the release
      # job only builds the bundle, packages, and runs post-package verification.
      - name: Build, sign, notarize, and verify release packages
        run: npm run package:mac -- --skip-verify --arch ${{ matrix.arch }}
        env:
          RELEASE_SIGNING_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gooeypi-public-macos-${{ matrix.arch }}
          path: |
            release/mac/${{ matrix.arch }}/*.dmg
            release/mac/${{ matrix.arch }}/*.zip
            release/mac/${{ matrix.arch }}/latest*.yml
          if-no-files-found: error

  package-linux:
    needs: [validate, quality, hermetic-e2e]
    strategy:
      # Ship both Linux architectures from native runners so npm install and
      # electron-builder package node-pty and ZeroMQ for the matching ABI.
      # Keep the legs independent so one architecture can never mask the
      # other's artifact or updater-feed failure.
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: x64
            runner: ubuntu-22.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: electron-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('package-lock.json') }}
      - name: Install pacman packaging dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - run: npm ci
      - run: npm run package:linux -- --skip-verify --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gooeypi-public-linux-${{ matrix.arch }}
          path: |
            release/linux/${{ matrix.arch }}/*.AppImage
            release/linux/${{ matrix.arch }}/*.deb
            release/linux/${{ matrix.arch }}/*.rpm
            release/linux/${{ matrix.arch }}/*.pacman
            release/linux/${{ matrix.arch }}/latest*.yml
          if-no-files-found: error

  package-windows:
    if: (github.event_name == 'workflow_dispatch' && inputs.include_windows) || (github.event_name == 'push' && vars.RELEASE_WINDOWS_ENABLED == 'true')
    needs: [validate, quality, hermetic-e2e]
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      # Authenticode verification asserts who signed, not merely that some
      # trusted chain signed: set the repository variables
      # GOOEYPI_WINDOWS_CERT_SUBJECT and/or GOOEYPI_WINDOWS_CERT_THUMBPRINT (see
      # docs/security.md). Windows packaging fails closed when neither is set.
      - name: Build, Authenticode-sign, and verify Windows packages
        run: npm run package:win -- --skip-verify
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          GOOEYPI_WINDOWS_CERT_SUBJECT: ${{ vars.GOOEYPI_WINDOWS_CERT_SUBJECT }}
          GOOEYPI_WINDOWS_CERT_THUMBPRINT: ${{ vars.GOOEYPI_WINDOWS_CERT_THUMBPRINT }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gooeypi-public-windows
          path: |
            release/win/**/*.exe
            release/win/**/*.zip
            release/win/**/latest*.yml
          if-no-files-found: error

  release-packages:
    needs: [validate, package, package-linux, package-windows]
    # always() keeps this aggregate gate from being skipped - and therefore from
    # silently satisfying a required status check - when a packaging job fails or
    # is cancelled; the result checks then fail it unless every needed job
    # succeeded (package-windows may legitimately be skipped).
    if: >-
      always() && needs.validate.result == 'success' && needs.package.result == 'success' && needs.package-linux.result == 'success' &&
      (needs.package-windows.result == 'success' || needs.package-windows.result == 'skipped')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # This job holds contents/attestations write, so it installs only the
      # runtime dependency tree the release script needs (js-yaml) instead of the
      # full dev toolchain.
      - name: Install release script dependencies
        run: npm ci --omit=dev --ignore-scripts
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: gooeypi-public-*
          path: downloaded-release-artifacts
      - name: Select release assets and generate SHA-256 checksums
        run: |
          platforms='mac,linux'
          if [ "$RELEASE_WINDOWS_ENABLED" = 'true' ]; then platforms="$platforms,win"; fi
          node scripts/release/prepare-github-release.mjs --input downloaded-release-artifacts --output release-assets --tag "$RELEASE_TAG" --platforms "$platforms"
      - name: Attest release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release
        run: |
          existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [ "$existing" = 'false' ]; then
            echo "Release $RELEASE_TAG is already published and will not be replaced."
            exit 1
          fi
          if [ "$existing" = 'true' ]; then
            gh release view "$RELEASE_TAG" --json assets > draft-release.json
            node scripts/release/prune-draft-release-assets.mjs --assets draft-release.json --expected release-assets > stale-assets.txt
            while IFS= read -r stale; do
              [ -n "$stale" ] || continue
              echo "Deleting stale draft asset: $stale"
              gh release delete-asset "$RELEASE_TAG" "$stale" --yes
            done < stale-assets.txt
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --verify-tag --draft=false --latest
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --verify-tag \
              --fail-on-no-commits \
              --generate-notes \
              --notes "Every installer and archive is covered by SHA256SUMS.txt and GitHub build-provenance attestations." \
              --title "GooeyPi ${RELEASE_TAG#v}" \
              --latest
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Add release link to the job summary
        run: echo "Published [$RELEASE_TAG]($(gh release view "$RELEASE_TAG" --json url --jq .url))" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
