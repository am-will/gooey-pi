name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-audit:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      # pull_request defaults to a synthetic merge ref; audit the immutable PR
      # head itself so this required status names the exact proposed lockfile.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - run: npm run release:preflight:toolchain
      - name: Apply named production dependency audit exceptions
        run: npm run audit:production

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run typecheck
      - run: npm run check
      - run: npm run test:coverage
      - run: npm run build:bundle
      - run: npm run release:bundle-size
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

  hermetic-e2e:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run build:bundle
      - run: npm run test:e2e:hermetic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: error

  windows-state-migration:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm exec -- vitest run tests/backend/store-windows-migration.test.ts

  packaging-smoke:
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: mac
            arch: arm64
            extra_args: --config.mac.identity=null
          - runner: ubuntu-22.04
            target: linux
            arch: x64
            extra_args: ''
          - runner: windows-2022
            target: win
            arch: x64
            extra_args: ''
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install headless display for packaged Linux launch
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: npm run build:bundle
      - run: node node_modules/electron-builder/cli.js --dir --${{ matrix.target }} --${{ matrix.arch }} --publish=never --config.directories.output=release/${{ matrix.target }}/${{ matrix.arch }} ${{ matrix.extra_args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - if: matrix.target != 'mac'
        run: node scripts/release/verify-cross-platform-package.mjs --platform ${{ matrix.target }} --arch ${{ matrix.arch }} --unpacked-only
      - name: Launch the packaged application to trusted renderer readiness
        id: packaged_smoke
        if: matrix.target != 'mac'
        run: node scripts/release/smoke-packaged-app.mjs --platform ${{ matrix.target }} --arch ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.packaged_smoke.outcome == 'failure'
        with:
          name: packaged-smoke-${{ matrix.target }}-${{ matrix.arch }}
          path: release/${{ matrix.target }}/${{ matrix.arch }}/packaged-smoke.log
          if-no-files-found: error

  local-qa-package:
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            package: npm run package:mac:local-qa
            artifact: gooeypi-local-qa-macos
            # Installers only: never upload the unpacked application directory.
            path: |
              release/mac/**/*.dmg
              release/mac/**/*.zip
          - runner: ubuntu-22.04
            package: npm run package:linux:local-qa
            artifact: gooeypi-local-qa-linux
            path: |
              release/linux/**/*.AppImage
              release/linux/**/*.deb
              release/linux/**/*.rpm
              release/linux/**/*.pacman
          - runner: windows-2022
            package: npm run package:win:local-qa
            artifact: gooeypi-local-qa-windows
            path: |
              release/win/**/*.exe
              release/win/**/*.zip
              release/win/**/*.appx
              release/win/**/*.msix
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run toolchain:bootstrap
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/Library/Caches/electron
            ~/.cache/electron
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install headless display for local-QA Linux launch
        if: matrix.runner == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
      - run: npm ci
      - run: npm run release:preflight:toolchain
      - run: ${{ matrix.package }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
